{% extends "core/base.html" %}

{% block title %}
Student Login
{% endblock %}

{% block content %}

<h2>Student Login</h2>

{% if messages %}

    {% for message in messages %}

        <p>{{ message }}</p>

    {% endfor %}

{% endif %}

<form method="post">

    {% csrf_token %}

    <p>
        <label for="identifier">
            Username or Email
        </label>

        <input
            type="text"
            name="identifier"
            id="identifier"
            autocomplete="username"
            required
        >
    </p>

    <p>
        <label for="password">
            Password
        </label>

        <input
            type="password"
            name="password"
            id="password"
            autocomplete="current-password"
            required
        >
    </p>

    <button type="submit">
        Log In
    </button>

</form>

<p>
    Don't have an account?

    <a href="{% url 'register' %}">
        Create one
    </a>
</p>

{% endblock %}
